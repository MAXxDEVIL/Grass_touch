# Impostor Hunt on free hosting: Render runs the app, Neon holds the database.
# Neither asks for a card. Import this repo as a Blueprint on Render, paste the
# DATABASE_URL Neon prints, and that is the whole deploy.
services:
  - type: web
    name: impostor-hunt
    runtime: node
    plan: free
    healthCheckPath: /
    # The generated Prisma client is not in the repo, so it is built here, and
    # --prod=false keeps the prisma CLI on disk for the boot command below.
    buildCommand: pnpm install --prod=false && pnpm build
    # A host with no release phase applies migrations at boot. Once the schema
    # is current this is a no-op, and free instances wake up often.
    startCommand: pnpm exec prisma migrate deploy && pnpm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
